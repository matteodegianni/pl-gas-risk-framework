# Central configuration for the Polish gas supply risk framework.
# All paths are relative to the repository root. Every tunable parameter
# lives here so that no module hardcodes a path, threshold or position.

project:
  name: pl-gas-risk-framework
  seed: 42

paths:
  raw_dir: data/raw            # immutable downloads (gitignored, licensed data)
  clean_dir: data/clean        # cleaned and aligned series (gitignored, derived data)
  outputs_dir: outputs         # committed summary tables (no raw price levels)
  investing_dir: data/raw/investing   # manual Investing.com exports are placed here

http:
  user_agent: "pl-gas-risk-framework/0.1 (portfolio research project)"
  timeout_s: 60
  retries: 3
  backoff_s: 2.0

sources:
  instrat:
    base_url: https://energy-api.instrat.pl/api
    gas_endpoint: prices/gas_price_rdn_daily   # TGEgasDA, PLN/MWh, indexed by delivery day
    co2_endpoint: v2/prices/co2                # EEX primary auction clearing prices, EUR/t
    start: "2016-01-01"
  nbp:
    base_url: https://api.nbp.pl/api/exchangerates/rates/a/eur
    start: "2010-01-01"
    chunk_days: 90             # NBP API rejects long date ranges, so requests are chunked
  ecb:
    url: https://data-api.ecb.europa.eu/service/data/EXR/D.PLN.EUR.SP00.A
    start: "2010-01-01"
  yahoo:
    eurpln_ticker: EURPLN=X
    start: "2010-01-01"
  investing:
    # Front month (CME listing, thin) and second month (ICE Endex, liquid).
    files:
      ttf_c1: ttf_c1.csv
      ttf_c2: ttf_c2.csv
    date_format: "%m/%d/%Y"    # English Investing.com site

ttf:
  # Which continuous series is the TTF hedge risk factor. "c2" is the ICE
  # second-month contract held to roll; "c1" is the CME front month.
  risk_series: c2
  expiry_uk_business_days_before: 2   # ICE Endex and CME TTF calendar month rule
  holiday_subdivision: ENG            # UK business days use England and Wales bank holidays

tge:
  # TGEgasDA for delivery day D is the volume weighted price of trades on day D-1.
  trade_date_lag_days: 1
  low_volume_ratio: 0.10     # flag trade days below 10% of the trailing 30-day median volume

quality:
  outlier_window: 250          # trading days in the rolling robust scale estimate
  outlier_min_periods: 60
  outlier_z: 6.0               # robust z-score (median / MAD) threshold on log returns
  confirm_ratio: 0.5           # a move is confirmed if a second series moves the same way by >= 50%
  contradict_ratio: 0.2        # a move is contradicted if the second series moves < 20% or the other way
  reversal_ratio: 0.5          # and the move reverses by >= 50% on the next observation
  stale_run_obs: 5             # consecutive unchanged prices that count as a stale run
  roll_z: 4.0                  # roll-day adjusted return beyond 4 robust sd is treated as misaligned
  roll_scale_window: 60
  fx_cross_source_tol: 0.005   # 0.5% relative gap between FX sources triggers a warning
  fx_ffill_max_days: 3         # max calendar days an NBP fixing is carried over a Polish holiday
  co2_ffill_max_days: 7        # max calendar days an auction price is carried forward

fx:
  # EUR/PLN source used as the risk factor. Chosen in Stage 2 by the FX timing
  # analysis (outputs/stage2_fx_timing.csv); the other sources stay as cross-checks.
  risk_source: ecb
  sources: [nbp, ecb, yahoo]

sample:
  # The aligned panel starts when all core series (TTF c1 and c2, TGE, FX) are available.
  start: auto
  # Sub-periods for descriptive statistics (modelling choice, documented in the Stage 2 report).
  subperiods:
    pre_crisis: ["2017-10-23", "2021-06-30"]
    crisis: ["2021-07-01", "2023-06-30"]
    post_crisis: ["2023-07-01", null]

forecasting:
  horizons: [1, 5, 21]          # business days: 1 day, 1 week, 1 month
  train_window: 750             # rolling estimation window (about 3 years)
  refit_every: 21               # parameters re-estimated every 21 trading days; state updated daily
  alpha: 0.05
  arima_orders: [[0, 0], [1, 0], [0, 1], [1, 1], [2, 0], [0, 2]]   # (p, q) candidates, chosen by AIC
  gbm:
    max_iter: 300
    learning_rate: 0.03
    max_depth: 3
    min_samples_leaf: 40
    l2_regularization: 1.0
  n_jobs: 4

volatility:
  series: [ttf, tge, eurpln, basis]
  distributions: [normal, t]     # GARCH(1,1) innovation distributions compared for every series
  extra_distributions:           # additional candidates per series
    basis: [skewt]
  # Mean equations, simplest first. Rule: keep the constant mean if its standardised residuals pass
  # Ljung-Box at all lb_lags; otherwise use the lowest-BIC candidate that passes.
  mean_candidates:
    - {name: constant, lags: 0, dow: false}
    - {name: ar1, lags: [1], dow: false}
    - {name: ar2, lags: [1, 2], dow: false}
    - {name: ar5, lags: 5, dow: false}
    - {name: ar10, lags: 10, dow: false}
    - {name: dow, lags: 0, dow: true}
    - {name: ar2_dow, lags: [1, 2], dow: true}
    - {name: ar5_dow, lags: 5, dow: true}
    - {name: ar10_dow, lags: 10, dow: true}
  lb_lags: [5, 10, 20]
  return_scale: 100              # log returns in percent for numerical stability (basis stays in EUR/MWh)
  ewma_lambda: 0.94              # RiskMetrics daily decay (benchmark)
  rolling_window: 63             # rolling historical variance benchmark (about 3 months)
  train_window: 750
  refit_every: 21
  horizons: [1, 5, 21]
  benchmark: ewma                # DM tests compare every model with this one
  alpha: 0.05
  n_jobs: 4

book:
  # SYNTHETIC positions (illustrative, not a real company's book).
  q_open_mwh: 500000          # open floating TGE purchase volume behind fixed-price PLN sales (short TGE)
  ttf_hedge_ratio: 0.70       # long TTF futures volume as a share of q_open_mwh
  fx_hedge_ratio: 0.70        # long EUR forward notional = ratio x q_open_mwh x TGE price in EUR (rebalanced daily)

var:
  var_levels: [0.95, 0.99]
  es_levels: [0.95, 0.975, 0.99]   # 97.5% ES is the Basel FRTB measure
  hs_window: 500
  normal_window: 250
  ewma_lambda: 0.94
  garch_window: 750
  refit_every: 21
  mc_sims: 20000
  copula_nu_grid: [3, 4, 5, 6, 7, 8, 10, 12, 15, 20, 30, 50]
  start_obs: 750                   # first forecast origin (same test start as Stages 3-4)

limits:
  # SYNTHETIC management limits (round numbers relative to the synthetic book; not fitted to the backtest).
  official_method: auto            # auto = passes conditional coverage at 95% and 99%, highest share of green windows
  var99_limit_pln: 25000000
  open_gas_exposure_limit_pln: 60000000   # unhedged volume x TGE price in PLN
  fx_net_open_limit_eur: 12000000         # EUR value of TGE purchases not covered by the EUR forward
  amber_threshold: 0.80
  driver_lookback_days: 20

stress:
  crisis_window: ["2021-07-01", "2022-12-31"]    # worst historical joint moves searched here
  windows_days: [1, 5, 10, 21]
  named_episodes:                               # close-to-close on panel dates
    - {name: "Russian invasion of Ukraine", start: "2022-02-23", end: "2022-03-07"}
    - {name: "August 2022 price peak run-up", start: "2022-07-29", end: "2022-08-26"}
    - {name: "Autumn 2021 squeeze", start: "2021-09-30", end: "2021-10-06"}
  hypothetical:                                 # relative moves; basis widening is an absolute TGE move in EUR/MWh
    - {name: "TTF +50% only (TGE unchanged)", tge: 0.0, ttf: 0.50, fx: 0.0}
    - {name: "gas complex +50% (TGE and TTF)", tge: 0.50, ttf: 0.50, fx: 0.0}
    - {name: "gas complex -50% (TGE and TTF)", tge: -0.50, ttf: -0.50, fx: 0.0}
    - {name: "EUR/PLN +5%", tge: 0.0, ttf: 0.0, fx: 0.05}
    - {name: "combined: gas complex +50% and EUR/PLN +5%", tge: 0.50, ttf: 0.50, fx: 0.05}
  basis_widening_eur_mwh: [10, 25]              # TGE (EUR) up by this amount, TTF unchanged
  sensitivity_grid:
    tge_pln: [-50, -10, 10, 50]
    ttf_eur: [-20, -5, 5, 20]
    fx: [-0.10, -0.05, 0.05, 0.10]

attribution:
  # SYNTHETIC one-year supply contract ending on the last panel date.
  contract_days: 365               # calendar days before the last panel date
  sale_margin_pln_mwh: 20.0        # fixed sale price = plan cost (TGE x EUR/PLN at signing) + margin
  seasonal_amplitude: 0.35         # contracted volume profile: winter peak
  demand_ar1: 0.7                  # synthetic demand deviation (weather-like AR(1))
  demand_sd: 0.08
  ttf_hedge_ratio: 0.70            # TTF futures = ratio x remaining contracted volume
  fx_hedge_ratio: 0.70             # EUR forward = ratio x remaining contracted volume x plan TGE price in EUR

diagnostics:
  alpha: 0.05
  ljung_box_lags: [5, 10, 20]
  arch_lm_lags: 5
  timing_lags: 3              # cross-correlations reported for lags -3..+3
  bootstrap_reps: 2000
  bootstrap_block: 20         # moving-block bootstrap keeps volatility clustering
