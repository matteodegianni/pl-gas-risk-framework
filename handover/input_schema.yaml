# Machine-readable input data specification (Stage 15). Read by src/gasrisk/validation.py.
# Each file lives in data/clean (generated by `python -m gasrisk.data.build`) and is never committed.
inputs:
  panel.csv:
    description: Aligned daily panel on TTF (ICE Endex, UK) trading days; one row per date.
    key: date
    min_rows: 1500
    max_staleness_calendar_days: 7     # last date must be within 7 days of the run date (warning, not error)
    columns:
      date:         {type: date, unique: true, monotonic: true}
      ttf_c2:       {type: float, min: 1, max: 1000, max_null_share: 0.0, unit: EUR/MWh}
      ttf_risk_ret: {type: float, min: -0.8, max: 0.8, max_null_share: 0.01, unit: log return}
      tge_pln:      {type: float, min: 5, max: 5000, max_null_share: 0.0, unit: PLN/MWh}
      tge_eur:      {type: float, min: 1, max: 1200, max_null_share: 0.0, unit: EUR/MWh}
      eurpln:       {type: float, min: 3.5, max: 6.0, max_null_share: 0.0, unit: PLN per EUR}
      eurpln_ret:   {type: float, min: -0.1, max: 0.1, max_null_share: 0.01, unit: log return}
    rules:
      - {id: IN-01, rule: "tge_eur equals tge_pln / eurpln", tolerance: 1.0e-6}
      - {id: IN-02, rule: "the Stage 1 data quality log exists (every outlier, gap and fill is logged there)"}
      - {id: IN-03, rule: "no calendar gap above 5 trading days"}
  garch_conditional_vol.csv:
    description: Stage 4 conditional volatility (percent) per series and distribution.
    key: date
    columns:
      date:  {type: date, unique: true, monotonic: true}
      ttf_t: {type: float, min: 0, max: 50, max_null_share: 0.01}
  garch_std_resid.csv:
    description: Stage 4 standardised residuals.
    key: date
    columns:
      date:  {type: date, unique: true, monotonic: true}
      ttf_t: {type: float, min: -30, max: 30, max_null_share: 0.01}
config:
  book.q_open_mwh:       {min: 0}
  book.ttf_hedge_ratio:  {min: 0, max: 1.5}
  book.fx_hedge_ratio:   {min: 0, max: 1.5}
  limits.amber_threshold: {min: 0.5, max: 1.0}
